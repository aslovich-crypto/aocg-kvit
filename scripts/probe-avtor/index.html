<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>проба автора чека</title>
<style>body{margin:0;background:#F6F7F9;width:430px}</style></head>
<body><div id="root"></div>
<div id="ЗАМЕР"></div>
<script>
// ⚠️ СЦЕНАРИЙ ПРОВЕРЯЕТ ПАРУ «ПОКАЗ И ОТБОР». Ради этой пары правка и делалась:
// подпись бралась из одного поля, фильтрация из другого, и разойтись они могли
// молча. Поэтому каждый шаг смотрит НА ЭКРАН, а не в исходник.
(function(){
  var шаги=[], ждём=0;
  var РЕЖИМ=new URLSearchParams(location.search).get("rezhim")||"cheki";
  // Роль берём ИЗ АДРЕСА, а не из window.__роль: модуль пробы грузится
  // с defer и к моменту сборки сценария ещё не выполнился.
  var РОЛЬ=new URLSearchParams(location.search).get("rol")||"admin";
  function кнопки(){ return [].slice.call(document.querySelectorAll('button')); }
  function кнопкаРовно(т){
    return кнопки().find(function(б){ return (б.textContent||"").trim()===т; });
  }
  function кнопкаСо(п){
    return кнопки().find(function(б){ return (б.textContent||"").indexOf(п)>=0; });
  }
  // ⚠️ НЕ `body.textContent` (найдено 05.09.2026 при разборе сторожа удаления).
  // Этот сценарий лежит инлайновым <script> ВНУТРИ body, и его собственный
  // исходник попадает в текст страницы: замер находил «Автор не указан» и
  // «Иванова Т.» в СВОИХ ЖЕ строках и отвечал «видно» на пустом экране —
  // сторож был ложно-зелёным. Смотрим только на отрисованное: у <script>
  // нет размеров, у настоящей строки экрана есть.
  function видимыйТекст(){
    var ходок=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var куски=[];
    while(ходок.nextNode()){
      var р=ходок.currentNode.parentElement;
      if(!р || р.tagName==="SCRIPT" || р.tagName==="STYLE") continue;
      var рект=р.getBoundingClientRect();
      if(рект.width<=0 || рект.height<=0) continue;
      куски.push(ходок.currentNode.nodeValue);
    }
    return куски.join(" ");
  }
  function естьНаЭкране(подстрока){
    return видимыйТекст().indexOf(подстрока)>=0;
  }
  // ⚠️ ЧИТАТЬ РАЗРЕЗ, А НЕ СТРАНИЦУ. Замер «видно Кофейню» краснел на
  // ИСПРАВНОМ фильтре, показывавшем «Итого 0,00 ₽». Причина, найденная
  // 05.09.2026: названия попадали в текст из ЭТОГО ЖЕ сценария — он лежит
  // инлайновым <script> внутри body. Первое объяснение («экраны остаются
  // в дереве») было ошибочным: экраны рендерятся условно и размонтируются.
  // Поднимаемся от заголовка вверх, пока не зацепили СОСЕДНИЙ разрез.
  var ЗАГОЛОВКИ=["По категориям","Организации","Методы оплаты","Сотрудники"];
  function разрез(имя){
    var н=[].slice.call(document.querySelectorAll("*")).find(function(э){
      return э.children.length===0 && (э.textContent||"").trim()===имя;
    });
    if(!н) return "";
    var у=н;
    while(у.parentElement){
      var т=у.parentElement.textContent||"";
      if(ЗАГОЛОВКИ.some(function(з){ return з!==имя && т.indexOf(з)>=0; })) break;
      у=у.parentElement;
    }
    return у.textContent||"";
  }
  // Продавцы ВНУТРИ разреза «Организации» — то, что человек видит на «Сводке».
  function продавцыВРазрезе(){
    var т=разрез("Организации");
    return ["Кофейня","Канцтовары","Такси"].filter(function(о){
      return т.indexOf(о)>=0;
    });
  }

  // Карточки чеков: у каждой в строке есть название продавца.
  function продавцыНаЭкране(){
    return ["Кофейня","Канцтовары","Такси"].filter(естьНаЭкране);
  }

  var сценарий=[
    ["① экран чеков", function(){
        var ч=кнопкаРовно("Чеки"); if(ч) ч.click();
      }, function(){
        return (window.__роль||"?")+" · "+(продавцыНаЭкране().join("+")||"ПУСТО");
      }],

    // Автор в строке списка: показывается только ролям, видящим чужие чеки.
    ["② подпись автора в списке", null, function(){
        // ⚠️ Ищем подпись В КАРТОЧКАХ ЧЕКОВ, а не в тексте всей страницы:
        // первая редакция брала body.textContent и ловила имена откуда угодно,
        // в том числе из невидимых шторок. Сторож, который не знает, ГДЕ
        // нашёл, доказывает не то.
        var листья=[].slice.call(document.querySelectorAll("span"))
          .filter(function(э){ return э.children.length===0; });
        var есть=листья.map(function(э){ return (э.textContent||"").trim(); })
          .filter(function(с){ return /^[А-ЯЁ][а-яё]+ [А-ЯЁ]\.$/.test(с); });
        return есть.length ? есть.join("+") : "нет подписей";
      }],

    // Карточка чека: автор показан ВСЕГДА, в том числе «Автор не указан».
    ["③ автор в карточке чужого чека", function(){
        var т=[].slice.call(document.querySelectorAll("*")).find(function(э){
          return э.children.length===0 && (э.textContent||"").trim()==="Канцтовары";
        });
        if(т) { var к=т.closest("div[style]"); (к||т).click(); }
      }, function(){
        // ⚠️ СЛОВА «Автор» БОЛЬШЕ НЕТ: 08.09.2026 подпись переехала в шапку,
        // под дату, и подписи-ярлыка у неё там нет — она стоит рядом с суммой
        // и ФНС как часть блока «про наш чек». Ищем саму подпись.
        if(естьНаЭкране("Иванова Т.")) return "Иванова Т.";
        if(естьНаЭкране("Автор не указан")) return "Автор не указан";
        return "НЕ ВИДЕН";
      }],

    // ⚠️ ГЛАВНОЕ УТВЕРЖДЕНИЕ ПЕРЕНОСА: автор стоит В ТОЙ ЖЕ КОЛОНКЕ, что
    // дата, — то есть в шапке справа, а не отдельной строкой ниже. Проверка
    // СТРУКТУРНАЯ (общий родитель), а не «видно на экране»: видно его было
    // и на старом месте, за фискальным блоком.
    ["③б автор стоит в шапке, рядом с датой", null, function(){
        // ⚠️ ЦЕЛИМСЯ В ПРАВУЮ КОЛОНКУ ШАПКИ ПО ЕЁ СОБСТВЕННОМУ ПРИЗНАКУ —
        // сумме кеглем 26. Две прежние редакции этого шага мерили не то:
        // сперва брали первый узел с датой (нашли СТРОКУ СПИСКА позади
        // карточки), потом искали подпись по всей странице — и на старом коде
        // шаг был ЗЕЛЁНЫМ у admin, потому что подпись с датой соседствуют
        // и в строке списка. Ложно-зелёный вскрыт обратной проверкой.
        var сумма=[].slice.call(document.querySelectorAll("div,span"))
          .filter(function(э){ return э.children.length===0; })
          .find(function(э){
            return parseFloat(getComputedStyle(э).fontSize)>=24
              && /₽/.test(э.textContent||"");
          });
        if(!сумма) return "ШАПКИ НЕТ (сумма не найдена)";
        var колонка=сумма.parentElement;
        var дети=[].slice.call(колонка.children);
        var текст=function(э){ return (э.textContent||"").trim(); };
        var подпись=дети.find(function(э){ return текст(э)==="Иванова Т."; });
        var дата=дети.find(function(э){ return /^\d{2}\.\d{2}\.\d{4}/.test(текст(э)); });
        if(!подпись) return "ПОДПИСИ В ШАПКЕ НЕТ (строк "+дети.length+")";
        if(!дата) return "ДАТЫ В ШАПКЕ НЕТ";
        var пп=подпись.getBoundingClientRect(), дд=дата.getBoundingClientRect();
        return пп.top>=дд.top ? "под датой, одна колонка" : "ВЫШЕ ДАТЫ";
      }],

    ["④ закрыта карточка", function(){
        var з=кнопкаСо("✕") || кнопкаСо("Закрыть"); if(з) з.click();
      }, function(){ return продавцыНаЭкране().length ? "список" : "НЕТ"; }],

    ["⑤ автор у чека без user_id", function(){
        var т=[].slice.call(document.querySelectorAll("*")).find(function(э){
          return э.children.length===0 && (э.textContent||"").trim()==="Такси";
        });
        if(т) { var к=т.closest("div[style]"); (к||т).click(); }
      }, function(){
        return естьНаЭкране("Автор не указан") ? "Автор не указан" : "НЕТ";
      }],
  ];

  // ⚠️ ФИЛЬТР «СОТРУДНИК» НА ЭКРАНЕ «ЧЕКИ» — ТОМ САМОМ, КОТОРЫЙ ОТКРЫВАЕТ
  // ЧЕЛОВЕК. 04.09.2026 владелец нашёл глазами то, чего не видел прибор:
  // отбор по автору перевели на `user_id`, сторож зеленел, мутации краснели —
  // а пункта «Сотрудник» в шторке «Чеков» не было вовсе, и дотянуться до
  // отбора с экрана было нельзя. Мерили «Сводку», открывают «Чеки».
  if(РЕЖИМ==="filtr"){
    // Продавец виден только в карточке чека: пункты шторки продавцов
    // не называют, а соседние экраны не смонтированы (условный рендер).
    var чекиВидно=function(){
      return ["Кофейня","Канцтовары","Такси"].filter(function(о){
        return [].slice.call(document.querySelectorAll("*")).some(function(э){
          if(э.children.length!==0 || (э.textContent||"").trim()!==о) return false;
          var р=э.getBoundingClientRect();
          return р.width>0 && р.height>0;
        });
      });
    };
    var пунктСотрудник=function(){
      var д=document.querySelector('[role="dialog"]');
      if(!д) return "ШТОРКИ НЕТ";
      var есть=[].slice.call(д.querySelectorAll("*")).some(function(э){
        return э.children.length===0 && (э.textContent||"").trim()==="Сотрудник";
      });
      return есть ? "пункт есть" : "пункта нет";
    };
    var отмечен=function(имя){
      var чип=кнопкаРовно(имя);
      if(!чип) return "ЧИПА НЕТ";
      return getComputedStyle(чип).backgroundColor==="rgb(164, 22, 26)"
        ? "отмечен" : "не отметился";
    };

    сценарий=[
      ["① экран чеков", function(){
          var ч=кнопкаРовно("Чеки"); if(ч) ч.click();
        }, function(){
          return (window.__роль||"?")+" · "+(чекиВидно().join("+")||"ПУСТО");
        }],

      ["② открыт фильтр", function(){
          var ф=document.querySelector('button[aria-label="Фильтры"]');
          if(ф) ф.click();
        }, function(){
          return кнопкаРовно("Применить") ? "фильтр открыт" : "НЕТ";
        }],

      // Роль решает, есть ли пункт вообще: свои чеки сотрудник и так видит
      // одни, выбор коллеги дал бы ему пустой экран (тот же приём, что
      // в «Отчётах» и «Сводке»).
      ["③ пункт «Сотрудник» в шторке", null, пунктСотрудник],
      // ⚠️ В ФИЛЬТРЕ ФОРМАТ ДРУГОЙ, И ЭТО РЕШЕНИЕ, А НЕ РАЗНОБОЙ: в чипе
      // выбора «Шукалович А.» и «Шукалов А.» неразличимы, а полные имена —
      // да. Шаг стережёт именно это: подпись в строке короткая, выбор
      // в списке полный. Формат чипа задаёт `полноеИмя`, и ЕГО ЖЕ строку
      // разбирает `идПоИмени` — пара, которую нельзя разорвать.
      ["③в в фильтре имя ПОЛНОЕ, а не подпись", null, function(){
          var кн=кнопки().map(function(б){ return (б.textContent||"").trim(); });
          var полные=кн.filter(function(с){
            return /^[А-ЯЁ][а-яё]+ [А-ЯЁ][а-яё]+$/.test(с);
          });
          var короткие=кн.filter(function(с){
            return /^[А-ЯЁ][а-яё]+ [А-ЯЁ]\.$/.test(с);
          });
          if(короткие.length) return "В ФИЛЬТРЕ ПОДПИСЬ: "+короткие.join("+");
          return полные.length ? "полные: "+полные.sort().join("+") : "ИМЁН НЕТ";
        }],
    ];

    if(РОЛЬ!=="employee") сценарий=сценарий.concat([
      // ⚠️ Выбор и применение — РАЗНЫМИ шагами: два click() в одном тике
      // React не успевает развести, и «Применить» отрабатывает обработчиком
      // прошлого рендера — с прошлым сотрудником.
      ["④а отмечен сотрудник БЕЗ чеков", function(){
          var к=кнопкаРовно("Пустой Человек"); if(к) к.click();
        }, function(){ return отмечен("Пустой Человек"); }],

      ["④б применён фильтр", function(){
          var п=кнопкаРовно("Применить"); if(п) п.click();
        }, function(){ return чекиВидно().join("+") || "пусто"; }],

      ["⑤а переоткрыт фильтр", function(){
          var ф=document.querySelector('button[aria-label="Фильтры"]');
          if(ф) ф.click();
        }, function(){
          return кнопкаРовно("Применить") ? "фильтр открыт" : "НЕТ";
        }],

      ["⑤б отмечен сотрудник С чеками", function(){
          var к=кнопкаРовно("Татьяна Иванова"); if(к) к.click();
        }, function(){ return отмечен("Татьяна Иванова"); }],

      ["⑤в применён фильтр", function(){
          var п=кнопкаРовно("Применить"); if(п) п.click();
        }, function(){ return чекиВидно().join("+") || "пусто"; }],
    ]);
  }


  // ⚠️ ГЛАВНЫЙ СТОРОЖ (требование владельца): выбор сотрудника, у которого
  // чеков НЕТ, обязан давать ПУСТО, а выбор сотрудника с чеками — ровно его
  // чеки. До правки выбор владельца отдавал ВСЕ чеки организации, а выбор
  // любого другого — пустоту всегда: сравнивалась подставленная строка.
  // Фильтр «Сотрудник» живёт на «Сводке» (SvodkaPage), там же разрез сумм.
  if(РЕЖИМ==="svodka"){
    сценарий=[
      ["① экран сводки", function(){
          var с=кнопкаРовно("Сводка"); if(с) с.click();
        }, function(){
          return (window.__роль||"?")+" · "+(естьНаЭкране("Итого за период") ? "открыта" : "НЕТ");
        }],

      // Разрез «по сотрудникам»: подписи берутся из user_id, значит в нём
      // должны быть ОБА автора и «Автор не указан» у ничейного чека.
      ["② разрез по авторам", null, function(){
          var т=разрез("Сотрудники");
          var есть=[];
          if(т.indexOf("Шукалович А.")>=0) есть.push("Шукалович А.");
          if(т.indexOf("Иванова Т.")>=0) есть.push("Иванова Т.");
          if(т.indexOf("Автор не указан")>=0) есть.push("Автор не указан");
          return есть.length ? есть.join("+") : "нет разреза";
        }],

      ["③ открыт фильтр", function(){
          // ⚠️ ИМЕННО button: тот же `aria-label="Фильтры"` носит и сам
          // диалог (role="dialog"), и селектор без имени тега открывал бы
          // «шторку шторкой».
          var ф=document.querySelector('button[aria-label="Фильтры"]');
          if(ф) ф.click();
        }, function(){
          return кнопкаРовно("Применить") ? "фильтр открыт" : "НЕТ";
        }],

      ["④а отмечен сотрудник БЕЗ чеков", function(){
          var к=кнопкаРовно("Пустой Человек"); if(к) к.click();
        }, function(){
          // ⚠️ У ЧИПА НЕТ `aria-pressed` — выбранность видна ТОЛЬКО фоном
          // (chip(on): вишнёвый против серого). Первая редакция замера
          // спрашивала атрибут, которого нет, и объявляла «не отметился»
          // на исправном коде: сторож обязан читать то, что есть.
          var чип=кнопкаРовно("Пустой Человек");
          if(!чип) return "ЧИПА НЕТ";
          var фон=getComputedStyle(чип).backgroundColor;
          return фон==="rgb(164, 22, 26)" ? "отмечен" : "не отметился ("+фон+")";
        }],

      ["④б применён фильтр", function(){
          var п=кнопкаРовно("Применить"); if(п) п.click();
        }, function(){
          // Диагностика: если фильтр не применился, надо видеть ПОЧЕМУ —
          // не нашлась кнопка, не нажалась или применилась и не подействовала.
          var чип=кнопки().find(function(б){
            return (б.textContent||"").trim()==="Пустой Человек";
          });
          return продавцыВРазрезе().length===0
            ? "пусто" : "видно "+продавцыВРазрезе().join("+");
        }],

      ["⑤а переоткрыт фильтр", function(){
          var ф=document.querySelector('button[aria-label="Фильтры"]');
          if(ф) ф.click();
        }, function(){
          return кнопкаРовно("Применить") ? "фильтр открыт" : "НЕТ";
        }],

      // ⚠️ ВЫБОР И ПРИМЕНЕНИЕ — РАЗНЫМИ ШАГАМИ, НЕ ОДНИМ. Два `click()` подряд
      // идут в одном тике: React не успевает перерисовать шторку, и «Применить»
      // отрабатывает обработчиком ПРЕДЫДУЩЕГО рендера — с прошлым сотрудником.
      // Слитый шаг давал «пусто» на исправном фильтре.
      ["⑤б отмечен сотрудник С чеками", function(){
          var к=кнопкаРовно("Татьяна Иванова"); if(к) к.click();
        }, function(){
          var чип=кнопкаРовно("Татьяна Иванова");
          if(!чип) return "ЧИПА НЕТ";
          return getComputedStyle(чип).backgroundColor==="rgb(164, 22, 26)"
            ? "отмечен" : "не отметился";
        }],

      ["⑤в применён фильтр", function(){
          var п=кнопкаРовно("Применить"); if(п) п.click();
        }, function(){
          return продавцыВРазрезе().join("+") || "пусто";
        }],
    ];
  }

  function идти(i){
    if(i>=сценарий.length){
      document.getElementById("ЗАМЕР").textContent=JSON.stringify(шаги);
      return;
    }
    if(сценарий[i][1]) сценарий[i][1]();
    setTimeout(function(){
      var что="—";
      try { что=сценарий[i][2](); } catch(е){ что="ОШИБКА ЗАМЕРА"; }
      шаги.push(сценарий[i][0]+": "+что);
      идти(i+1);
    }, 650);
  }
  function старт(){
    if(!кнопкаРовно("Чеки") && ждём++<80) return setTimeout(старт,150);
    if(!кнопкаРовно("Чеки")){
      document.getElementById("ЗАМЕР").textContent=
        JSON.stringify({"НЕ_ОТРИСОВАЛОСЬ":true,
          "причина":"приложение не поднялось за 12 с"});
      return;
    }
    идти(0);
  }
  старт();
})();
</script>
<script type="module" src="./probe.jsx"></script></body></html>
