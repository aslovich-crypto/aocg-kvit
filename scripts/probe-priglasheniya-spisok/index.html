<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>проба списка приглашений</title>
<style>body{margin:0;background:#F6F7F9;width:430px}</style></head>
<body><div id="root"></div>
<div id="ЗАМЕР"></div>
<script>
// ⚠️ СЦЕНАРИЙ ИДЁТ ПО ЭКРАНУ «ПОЛЬЗОВАТЕЛИ» — тому, где человек смотрит
// приглашения (правило T165).
(function(){
  var шаги=[], ждём=0;
  var СЛУЧАЙ=new URLSearchParams(location.search).get("sluchay")||"";
  function кнопки(){ return [].slice.call(document.querySelectorAll('button')); }
  function кнопкаСо(п){
    return кнопки().find(function(б){ return (б.textContent||"").indexOf(п)>=0; });
  }
  // ⚠️ ТОЛЬКО ВИДИМЫЙ ТЕКСТ (T169): инлайновый <script> лежит внутри body,
  // и `body.textContent` вернул бы собственный исходник сценария.
  function видимыйТекст(){
    var ходок=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var куски=[];
    while(ходок.nextNode()){
      var р=ходок.currentNode.parentElement;
      if(!р || р.tagName==="SCRIPT" || р.tagName==="STYLE") continue;
      var рект=р.getBoundingClientRect();
      if(рект.width<=0 || рект.height<=0) continue;
      куски.push(ходок.currentNode.nodeValue);
    }
    return куски.join(" ");
  }
  function естьНаЭкране(п){ return видимыйТекст().indexOf(п)>=0; }
  // Порядок на экране: сравниваем МЕСТА вхождений в видимом тексте.
  function место(п){ return видимыйТекст().indexOf(п); }

  var сценарий=[
    ["① экран пользователей", function(){
        var а=document.querySelector('button[aria-label="Аккаунт"]');
        if(а) а.click();
        setTimeout(function(){
          var л=кнопкаСо("Пользователи"); if(л) л.click();
        }, 300);
      }, function(){
        return естьНаЭкране("Приглашения") ? "открыт" : "НЕТ";
      }],

    // ⚠️ ЖИВЫЕ ВПЕРЕДИ, ОТРАБОТАВШИЕ ОТДЕЛЬНО И СВЁРНУТЫ: в базе погашенных
    // большинство, вперемешку они завалили бы собой рабочие.
    ["② отработавшие отделены от живых", null, function(){
        if(СЛУЧАЙ==="sboy") return "случай без списка";
        // ⚠️ В карточке видно ИМЯ, а почта — только когда имени нет
        // (`[first_name, last_name].join(" ") || email`). Замер по почте
        // краснел на исправном экране: искал то, чего там не рисуют.
        var живая=естьНаЭкране("Пётр Петров");
        var раздел=естьНаЭкране("Отработавшие");
        var чужой=естьНаЭкране("Иван Иванов");
        return (живая?"живая видна":"ЖИВОЙ НЕТ")+
          " · "+(раздел?"раздел есть":"РАЗДЕЛА НЕТ")+
          " · "+(чужой?"ОТРАБОТАВШАЯ В ОБЩЕМ СПИСКЕ":"отработавшие свёрнуты");
      }],

    ["③ раздел «Отработавшие» ниже живых", null, function(){
        if(СЛУЧАЙ!=="") return "случай без разбора";
        var ж=место("Пётр Петров"), о=место("Отработавшие");
        if(ж<0 || о<0) return "НЕ НАЙДЕНО";
        return ж<о ? "живые выше" : "ОТРАБОТАВШИЕ ВЫШЕ";
      }],

    // ⚠️ ГЛАВНОЕ: у отработавшей видно, КОГО завели и когда.
    ["④ кого завели", function(){
        var о=кнопкаСо("Отработавшие"); if(о) о.click();
      }, function(){
        if(СЛУЧАЙ==="sboy") return "случай без списка";
        var кто=естьНаЭкране("вошёл: Иван Иванов");
        var когда=естьНаЭкране("05.09.2026");
        return (кто?"назван":"НЕ НАЗВАН")+" · "+(когда?"со временем":"без времени");
      }],

    // ⚠️ У СТАРОЙ ССЫЛКИ ОТМЕТКИ НЕТ — и это говорится СЛОВОМ, а не пустотой:
    // пустое место человек прочитал бы как «никто не вошёл», что неправда.
    ["⑤ старая строка без отметки", null, function(){
        if(СЛУЧАЙ==="sboy") return "случай без списка";
        return естьНаЭкране("кто вошёл — неизвестно")
          ? "сказано словом" : "МОЛЧИТ";
      }],

    // «Список пуст» и «список не загрузился» — разные вещи и разные действия.
    ["⑥ пусто отличается от отказа", null, function(){
        var нет=естьНаЭкране("Нет ожидающих приглашений");
        var сбой=естьНаЭкране("сервер не ответил");
        var повтор=!!кнопкаСо("Загрузить ещё раз");
        if(СЛУЧАЙ==="sboy")
          return (сбой?"сказано про связь":"НЕ СКАЗАНО")+
            (нет?" · НО НАПИСАНО «НЕТ ПРИГЛАШЕНИЙ»":"")+
            (повтор?" · есть повтор":" · без повтора");
        if(СЛУЧАЙ==="pusto")
          return (нет?"сказано про пустоту":"МОЛЧИТ")+
            (сбой?" · НО НАПИСАНО ПРО СВЯЗЬ":"");
        return "случай с живыми";
      }],
    ["⑦ отказ на «Отозвать» слышен", function(){
        if(СЛУЧАЙ!=="otzyv") return;
        var к=кнопкаСо("Отозвать"); if(к) к.click();
      }, function(){
        if(СЛУЧАЙ!=="otzyv") return "случай без отзыва";
        return естьНаЭкране("ссылка осталась рабочей") ? "сказано" : "МОЛЧА";
      }],
  ];

  function идти(i){
    if(i>=сценарий.length){
      document.getElementById("ЗАМЕР").textContent=JSON.stringify(шаги);
      return;
    }
    if(сценарий[i][1]) сценарий[i][1]();
    setTimeout(function(){
      var что="—";
      try { что=сценарий[i][2](); } catch(е){ что="ОШИБКА ЗАМЕРА"; }
      шаги.push(сценарий[i][0]+": "+что);
      идти(i+1);
    }, 700);
  }
  function старт(){
    var готов=function(){
      return !!document.querySelector('button[aria-label="Аккаунт"]');
    };
    if(!готов() && ждём++<80) return setTimeout(старт,150);
    if(!готов()){
      document.getElementById("ЗАМЕР").textContent=
        JSON.stringify({"НЕ_ОТРИСОВАЛОСЬ":true});
      return;
    }
    идти(0);
  }
  старт();
})();
</script>
<script type="module" src="./probe.jsx"></script></body></html>
