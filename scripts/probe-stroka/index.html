<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>замер строки списка «Чеки»</title>
<style>html,body{margin:0;background:#F6F7F9}
/* ⚠️ РАМКА 320×568 ЗАДАНА РАЗМЕТКОЙ, А НЕ ФЛАГОМ БРАУЗЕРА, И ЭТО ЗАМЕРЕНО,
   А НЕ ВЫБРАНО. Chrome в этой установке --window-size НЕ СОБЛЮДАЕТ вовсе:
   проверено на пустой странице, все три режима headless дают 500×481.
   Первый прогон замера прошёл на 500px и был недействителен — числа
   относились к ширине, которой ни у кого нет.
   Приложение тянет оболочку в 100dvh (App.jsx:7825 и др.), поэтому высоту
   навязываем правилом с !important: инлайновый стиль оно перебивает. */
body{width:320px;height:568px;overflow:hidden}
#root{height:568px;overflow:hidden}
#root div[style*="dvh"]{height:568px!important;min-height:568px!important;
  max-height:568px!important}</style></head>
<body><div id="root"></div>
<div id="ЗАМЕР"></div>
<script>
// ⚠️ ЗАМЕР ГЕОМЕТРИИ СТРОКИ СПИСКА (T172, часть 1). Ничего не чиним —
// меряем, что есть, и меряем ГИПОТЕЗУ переноса карты вниз, применяя её
// К ОТРИСОВАННОМУ DOM. Арифметика здесь запрещена: в UX-26 ответ «влезет ли»
// оказался ОБРАТНЫМ подсчёту, и владелец потребовал прибор.
//
// ⚠️ УЗЛЫ ИЩУТСЯ ПО ПРИЗНАКУ, А НЕ ПО ПОРЯДКУ В DOM. Шесть промахов за три
// дня (T158, UX-26) были ровно этим: прибор целился в соседний узел того же
// экрана. Здесь строка опознаётся по `translateX` в inline-стиле (это и есть
// свайп-передок, App.jsx:1329), мета-строка — по кеглю 13px внутри неё.
(function(){
  var ждём=0;
  // ⚠️ МОЛЧАНИЕ ПРОБЫ — НЕ ОТВЕТ. Дважды за эти дни пустой вывод принимался
  // за «не отрисовалось», хотя на деле падал сам сценарий. Ошибка обязана
  // доехать до отчёта с именем и местом.
  function сдаться(что){
    try {
      document.getElementById("ЗАМЕР").textContent=
        JSON.stringify({ОШИБКА_ПРОБЫ:String(что && что.stack || что)});
    } catch(е){}
  }
  window.addEventListener("error", function(е){ сдаться(е.error||е.message); });
  window.addEventListener("unhandledrejection", function(е){ сдаться(е.reason); });
  function число(x){ return Math.round(x*10)/10; }
  function p_r(э){ return э.getBoundingClientRect(); }
  function p_h(р){ return р.height; }

  function передки(){
    return [].slice.call(document.querySelectorAll('div[style*="translateX"]'))
      .filter(function(э){ var р=э.getBoundingClientRect(); return р.height>0; });
  }
  // ⚠️ МЕТА-СТРОКА — ПЕРВЫЙ 13px-ряд ЛЕВОЙ КОЛОНКИ, А НЕ «ТОТ, ГДЕ ДАТА».
  // Первая редакция искала по дате — и в варианте-потолке, где дата уезжает
  // вниз, находила НИЖНИЙ ряд: подпись «не найдена» на экране, где она есть.
  // Тот же промах, что в UX-26: прибор целится в соседний узел (T158).
  // ⚠️ ЛЕВАЯ КОЛОНКА ОПОЗНАЁТСЯ ПО НАЗВАНИЮ ОРГАНИЗАЦИИ (15px/500), А НЕ ПО
  // ПОРЯДКУ ДЕТЕЙ. В варианте ①b строка разворачивается в столбец, и
  // children[0] — уже обёртка, а не колонка: прибор возвращал ноль строк
  // и молча докладывал «подписей 0 из 0». Третий раз за задачу тот же
  // промах — цель по месту вместо цели по признаку.
  function леваяКолонка(строка){
    var имя=[].slice.call(строка.querySelectorAll('span')).find(function(э){
      var с=getComputedStyle(э);
      return с.fontSize==="15px" && с.fontWeight==="500";
    });
    return имя ? имя.parentElement : null;
  }
  function ряды(строка){
    var левая=леваяКолонка(строка);
    if(!левая) return [];
    return [].slice.call(левая.children).filter(function(э){
      return getComputedStyle(э).fontSize==="13px";
    });
  }
  function мета(строка){ return ряды(строка)[0]; }
  function срез(э){
    var р=э.getBoundingClientRect();
    return { w:число(р.width), h:число(р.height),
             cw:число(э.clientWidth), sw:число(э.scrollWidth),
             обрезан: э.scrollWidth > э.clientWidth+0.5,
             текст:(э.textContent||"").trim().slice(0,28) };
  }
  // Автор — по признаку «Фамилия И.», а не по месту: место как раз и меняется.
  // ⚠️ ЛИСТЬЯ ЛЮБОГО ТЕГА: с 08.09 подпись — БЛОЧНЫЙ узел своей строки,
  // а не span в мета-строке. Проба, знавшая только span, доложила бы
  // «автора нет» на экране, где он стоит.
  function автор(где){
    return [].slice.call(где.querySelectorAll('span,div')).filter(function(э){
      return !э.children.length;
    }).find(function(э){
      return /^[А-ЯЁ][а-яё\-]+\s[А-ЯЁ]\.$/.test((э.textContent||"").trim());
    });
  }
  // Блок оплаты — span с иконкой (svg). ⚠️ МЕРИТЬ НАДО НЕ ЕГО: у обёртки
  // overflow:hidden и flex, её scrollWidth не отражает содержимого — первая
  // редакция получила sw=18 на четырёх цифрах и чуть не доложила это числом.
  // Мерим ПОДПИСЬ внутри — последний span без потомков.
  function оплата(где){
    var о=[].slice.call(где.querySelectorAll('span')).find(function(э){
      return э.querySelector('svg');
    });
    if(!о) return null;
    var т=[].slice.call(о.querySelectorAll('span')).filter(function(э){
      return !э.children.length && (э.textContent||"").trim();
    });
    return т.length? т[т.length-1] : о;
  }
  function дата(где){
    return [].slice.call(где.querySelectorAll('span')).find(function(э){
      return /^\d{2}\.\d{2}\.\d{4}$/.test((э.textContent||"").trim());
    });
  }
  // Подложка удаления: абсолютный блок с aria-label — её высота обязана
  // совпасть с высотой строки, иначе жест обнажит пустоту.
  function подложка(строка){
    return строка.parentElement.querySelector('[aria-label="Удалить чек"]');
  }

  function снимок(метка){
    var из=[];
    передки().forEach(function(с,i){
      var м=мета(с);
      var а=автор(с), о=оплата(с), п=подложка(с);
      var рс=с.getBoundingClientRect();
      из.push({
        "№": i+1,
        строка: { h:число(рс.height), w:число(рс.width) },
        мета: м?срез(м):null,
        дата: (function(){ var д=дата(с); return д?срез(д):null; })(),
        автор: а?срез(а):null,
        нехватка: а?число(а.scrollWidth-а.clientWidth):null,
        оплата: о?срез(о):null,
        подложка: п?{ h:число(п.getBoundingClientRect().height) }:null,
        колонки: [].slice.call(с.children).map(function(к){
          var р=к.getBoundingClientRect();
          return число(р.width);
        })
      });
    });
    var _р=рамка().getBoundingClientRect();
    return { метка:метка, окно:{ w:число(_р.width), h:число(_р.height) },
             строк:из.length, видноЦеликом: видно(), строки:из };
  }

  // ⚠️ «СКОЛЬКО ВИДНО» — ЧИСЛО, А НЕ «МЕНЬШЕ». Считаем строки, целиком
  // попадающие в окно: частично видная строка человеку счёта не прибавляет.
  // ⚠️ СЧИТАЕМ ОТНОСИТЕЛЬНО РАМКИ, А НЕ ОКНА. window.innerHeight здесь 481 —
  // столько даёт headless вне зависимости от флагов; рамка же честные 568.
  // Считать по окну значило бы доложить число для экрана, которого нет.
  function рамка(){ return document.getElementById("root"); }
  function видно(){
    var р=рамка().getBoundingClientRect();
    return передки().filter(function(с){
      var с_=с.getBoundingClientRect();
      return с_.top>=р.top-0.5 && с_.bottom<=р.bottom+0.5;
    }).length;
  }

  // ⚠️ РЕШЕНИЕ ВЛАДЕЛЬЦА 08.09 ПО МАКЕТАМ: подпись автора уходит ВТОРОЙ
  // СТРОКОЙ под дату. Прежнее решение (вниз уезжает карта) отменено — замер
  // показал, что оно даёт подписи +17px при нехватке 47–133.
  //
  // ⚠️ МЕСТ ДЛЯ «СВОЕЙ СТРОКИ» ДВА, И ОНИ ДАЮТ РАЗНУЮ ШИРИНУ. Внутри левой
  // колонки строка наследует её пол 148px; во всю ширину карточки — 288
  // минус поля. Разница решает вопрос «влезает ли 168», поэтому меряем оба,
  // а не выбираем по виду разметки.
  function рядВнизу(куда, ст){
    var низ=document.createElement('div');
    низ.style.cssText="display:flex;align-items:center;gap:6px;font-size:"+
      ст.fontSize+";color:"+ст.color+";font-family:"+ст.fontFamily+
      ";min-width:0;white-space:nowrap;overflow:hidden";
    куда.appendChild(низ);
    return низ;
  }
  // ①a — своя строка ВНУТРИ левой колонки
  function авторВнизКолонки(){
    передки().forEach(function(с){
      var м=мета(с); if(!м) return;
      var а=автор(с); if(!а) return;
      var пред=а.previousElementSibling;
      if(пред && !пред.textContent.trim()) пред.remove();
      рядВнизу(м.parentElement, getComputedStyle(м)).appendChild(а);
    });
  }
  // ①b — своя строка ВО ВСЮ ШИРИНУ карточки, под обеими колонками
  function авторВнизСтроки(){
    передки().forEach(function(с){
      var а=[].slice.call(с.querySelectorAll('span')).find(function(э){
        return /^[А-ЯЁ][а-яё\-]+\s[А-ЯЁ]\.$/.test((э.textContent||"").trim());
      });
      if(!а) return;
      var пред=а.previousElementSibling;
      if(пред && !пред.textContent.trim()) пред.remove();
      // ⚠️ СТРОКА — FLEX-РЯД ИЗ ДВУХ КОЛОНОК. Чтобы подпись легла ПОД ними,
      // а не третьей колонкой рядом, разворачиваем сам передок в столбец.
      с.style.flexDirection="column";
      с.style.alignItems="stretch";
      var верх=document.createElement('div');
      верх.style.cssText="display:flex;align-items:flex-start;"+
        "justify-content:space-between;gap:12px";
      while(с.children.length) верх.appendChild(с.children[0]);
      с.appendChild(верх);
      var низ=рядВнизу(с, getComputedStyle(а));
      низ.style.marginTop="4px";
      низ.appendChild(а);
    });
  }

  // ⚠️ СНАЧАЛА ПЕРЕЙТИ НА «ЧЕКИ». Приложение открывается на «Главной», и там
  // строки — ДРУГОЙ компонент (кнопки, без свайпа и без автора). Первая
  // редакция замера мерила её и доложила «не отрисовалось»: экран был,
  // предмета на нём не было (T165).
  // ⚠️ ЖЕСТ ПРОВЕРЯЕТСЯ ДЕЙСТВИЕМ, А НЕ ЧТЕНИЕМ КОДА, И С ОЖИДАНИЕМ.
  // Первая редакция читала style.transform СРАЗУ после броска событий и
  // получала «translateX(0px)» на живом жесте: обработчик зовёт setTx,
  // а React применяет состояние следующим кадром. Прибор докладывал
  // «жест сломан» про собственную спешку.
  function свайп(с, дальше){
    var р=с.getBoundingClientRect();
    var y=р.top+р.height/2, x0=р.right-20;
    function бросить(тип,x){
      с.dispatchEvent(new PointerEvent(тип,{bubbles:true,cancelable:true,
        clientX:x,clientY:y,pointerId:1,isPrimary:true,pointerType:"touch",
        button:0,buttons:1,width:1,height:1,pressure:0.5}));
    }
    var было=с.style.transform;
    бросить("pointerdown",x0);
    бросить("pointermove",x0-20);
    бросить("pointermove",x0-70);
    setTimeout(function(){
      var вовремя=с.style.transform;
      бросить("pointerup",x0-70);
      setTimeout(function(){
        дальше({ было:было, вовремя:вовремя, после:с.style.transform });
      }, 300);
    }, 300);
  }
  function наЧеки(){
    var к=[].slice.call(document.querySelectorAll('button')).find(function(б){
      return (б.textContent||"").trim()==="Чеки";
    });
    if(к) к.click();
    return !!к;
  }
  function готов(){ return передки().length>0 && !!мета(передки()[0]); }
  function старт(){
    if(!готов()) наЧеки();
    if(!готов() && ждём++<100) return setTimeout(старт,150);
    if(!готов()){
      document.getElementById("ЗАМЕР").textContent=
        JSON.stringify({"НЕ_ОТРИСОВАЛОСЬ":true});
      return;
    }
    var до=снимок("СЕЙЧАС");
    // ⚠️ ДВА МЕСТА — ДВА ПРОГОНА, А НЕ ДВЕ ПЕРЕСТАНОВКИ ПОДРЯД. Применить
    // ①a, а затем поверх неё ①b значило бы мерить разметку, которой ни один
    // из вариантов не создаёт. Вариант приходит параметром ?variant=.
    var ВАР=new URLSearchParams(location.search).get("variant")||"a";
    // ⚠️ КОНТРОЛЬ ЖЕСТА НА ОДНОСТРОЧНОЙ СТРОКЕ — ДО перестановки. Без него
    // «жест сломан» ничего не значит: синтетическое событие могло просто
    // не дойти до обработчика, и прибор доложил бы про себя.
    try {
    свайп(передки()[0], function(жест1){
      до.жест=жест1;
      if(ВАР==="b") авторВнизСтроки(); else авторВнизКолонки();
      setTimeout(function(){
        var после=снимок(ВАР==="b"
          ? "①b автор своей строкой ВО ВСЮ ШИРИНУ карточки"
          : "①a автор своей строкой ВНУТРИ левой колонки");
        свайп(передки()[1], function(жест2){
          после.жест=жест2;
          var п=подложка(передки()[1]);
          после.подложкаПослеЖеста=п?число(p_h(p_r(п))):null;
          document.getElementById("ЗАМЕР").textContent=
            JSON.stringify({до:до, после:после});
        });
      }, 300);
    });
    } catch(е){ сдаться(е); }
  }
  старт();
})();
</script>
<script type="module" src="./probe.jsx"></script></body></html>
