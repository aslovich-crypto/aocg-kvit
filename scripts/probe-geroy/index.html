<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>проба заголовка карточки чека</title>
<style>body{margin:0;background:#F6F7F9;width:320px}</style></head>
<body><div id="root"></div>
<div id="ЗАМЕР"></div>
<script>
// ⚠️ ШИРИНА 320 — САМЫЙ УЗКИЙ ИЗ РЕАЛЬНЫХ ЭКРАНОВ. Если заголовок влезает
// здесь, влезет везде; если нет — число нужно владельцу, а не подгонка.
//
// ⚠️ МЕРЯЕМ ГЕОМЕТРИЮ, А НЕ ТЕКСТ (T169): `textContent` содержит полное
// название и когда оно визуально обрезано многоточием.
(function(){
  var шаги=[], ждём=0;
  function кнопки(){ return [].slice.call(document.querySelectorAll('button')); }
  function кнопкаРовно(т){
    return кнопки().find(function(б){ return (б.textContent||"").trim()===т; });
  }
  // ⚠️ УЗЕЛ ИЩЕТСЯ С УЧЁТОМ КЕГЛЯ, А НЕ ПРОСТО ПЕРВЫЙ ПОДХОДЯЩИЙ. Первая
  // редакция брала первое совпадение и мерила СТРОКУ СПИСКА, которая видна
  // позади карточки: правка заголовка карточки на неё не влияла, и сторож
  // оставался красным на верном коде. Тот же класс, что «прибор про чужую
  // цель» (T158), только цель — соседний узел на том же экране.
  function узлыСТекстом(часть){
    return [].slice.call(document.querySelectorAll("*")).filter(function(э){
      if(э.children.length) return false;
      var т=(э.textContent||"").trim();
      if(т.indexOf(часть)<0) return false;
      var р=э.getBoundingClientRect();
      return р.width>0 && р.height>0;
    });
  }
  function узелСТекстом(часть){ return узлыСТекстом(часть)[0]; }
  // Заголовок героя — САМЫЙ КРУПНЫЙ из узлов с этим текстом (18px против 15
  // в строке списка и 13 в подписи).
  function заголовок(часть){
    var узлы=узлыСТекстом(часть);
    var лучший=null, кегль=-1;
    узлы.forEach(function(э){
      var к=parseFloat(getComputedStyle(э).fontSize)||0;
      if(к>кегль){ кегль=к; лучший=э; }
    });
    return лучший;
  }
  // Отчёт по узлу: сколько строк занимает и обрезан ли — по РАЗМЕРАМ.
  function геометрия(э){
    if(!э) return null;
    var с=getComputedStyle(э);
    var высотаСтроки=parseFloat(с.lineHeight);
    if(!высотаСтроки || isNaN(высотаСтроки)) высотаСтроки=parseFloat(с.fontSize)*1.25;
    return {
      строк: Math.round(э.clientHeight/высотаСтроки),
      строкВсего: Math.round(э.scrollHeight/высотаСтроки),
      режетПоШирине: э.scrollWidth > э.clientWidth+1,
      режетПоВысоте: э.scrollHeight > э.clientHeight+1,
      ширина: Math.round(э.clientWidth)
    };
  }
  function открытьЧек(часть){
    var узел=узелСТекстом(часть);
    if(!узел) return false;
    var у=узел;
    while(у && у!==document.body){
      if(у.tagName==="BUTTON" || (у.getAttribute && у.getAttribute("role")==="button")){ у.click(); return true; }
      у=у.parentElement;
    }
    узел.click(); return true;
  }
  function закрыть(){
    var к=document.querySelector('button[aria-label="Закрыть"]');
    if(к) к.click();
  }

  var сценарий=[
    ["① экран чеков", function(){
        var к=кнопкаРовно("Чеки"); if(к) к.click();
      }, function(){ return узелСТекстом("ВИЗА МЕНЕДЖМЕНТ") ? "оба чека в списке" : "НЕТ"; }],

    ["② карточка длинного юрлица открыта", function(){
        открытьЧек("ВИЗА МЕНЕДЖМЕНТ");
      }, function(){
        return узелСТекстом("ВИЗА МЕНЕДЖМЕНТ") ? "карточка открыта" : "НЕТ";
      }],

    // ⚠️ ГЛАВНОЕ УТВЕРЖДЕНИЕ ПРОБЫ.
    ["③ заголовок не обрезан", null, function(){
        var г=геометрия(заголовок("ВИЗА МЕНЕДЖМЕНТ"));
        if(!г) return "УЗЛА НЕТ";
        if(г.режетПоШирине) return "ОБРЕЗАН по ширине (нужно "+г.строкВсего+" стр, ширина "+г.ширина+")";
        if(г.режетПоВысоте) return "ОБРЕЗАН по высоте (влезает "+г.строк+" из "+г.строкВсего+")";
        return "виден целиком в "+г.строк+" стр";
      }],
    ["④ заголовок не длиннее двух строк", null, function(){
        var г=геометрия(заголовок("ВИЗА МЕНЕДЖМЕНТ"));
        if(!г) return "УЗЛА НЕТ";
        return г.строк<=2 ? "строк "+г.строк : "строк "+г.строк+" — БОЛЬШЕ ДВУХ";
      }],

    ["⑤ карточка закрыта", function(){ закрыть(); },
      function(){ return кнопкаРовно("Чеки") ? "список" : "НЕТ"; }],

    // ⚠️ ОТКРЫВАЕМ ПО ТЕКСТУ СТРОКИ СПИСКА, А НЕ ПО БРЕНДУ: в списке стоит
    // сокращённое ЮРЛИЦО, бренда там нет вовсе. Первая редакция кликала
    // «ВкусВилл», карточка не открывалась, и шаг ⑦ мерил СТРОКУ СПИСКА —
    // однострочную по построению. Прибор был зелёным на непроверенном месте.
    ["⑥ карточка с брендом открыта", function(){
        открытьЧек("ПРОИЗВОДСТВЕННО-ТОРГОВАЯ");
      }, function(){
        var з=заголовок("ВкусВилл");
        return з && parseFloat(getComputedStyle(з).fontSize)>=16
          ? "карточка открыта" : "НЕТ";
      }],
    // ⚠️ РЕШЕНИЕ ВЛАДЕЛЬЦА 07.09.2026: две строки получает ТОЛЬКО заголовок.
    // Подпись под ним однострочная — её обрезка терпима, заголовка нет.
    ["⑦ подпись под заголовком однострочна", null, function(){
        // ⚠️ ПОДПИСЬ — УЗЕЛ КЕГЛЯ 13, А НЕ «САМЫЙ МЕЛКИЙ ИЗ НАЙДЕННЫХ»:
        // строка списка позади карточки несёт тот же текст кеглем 15.
        var подпись=узлыСТекстом("СИБИРСКИЕ ТРАДИЦИИ").find(function(э){
          return parseFloat(getComputedStyle(э).fontSize)<=14;
        });
        var г=геометрия(подпись);
        if(!г) return "УЗЛА НЕТ";
        return г.строк===1 ? "строк 1" : "строк "+г.строк+" — ПОДПИСЬ РАЗЪЕХАЛАСЬ";
      }],
    ["⑧ карточка длинного СЛОВА закрыта и открыта", function(){
        закрыть();
        setTimeout(function(){ открытьЧек("ПРОИЗВОДСТВЕННОТОРГОВАЯ"); }, 200);
      }, function(){
        return заголовок("ПРОИЗВОДСТВЕННОТОРГОВАЯ") ? "карточка открыта" : "НЕТ";
      }],
    // ⚠️ ШАГ РАДИ `overflow-wrap: anywhere`: слово без пробелов не переносится
    // само, и без этого правила уезжает за край.
    ["⑨ длинное слово рвётся, а не уезжает", null, function(){
        var г=геометрия(заголовок("ПРОИЗВОДСТВЕННОТОРГОВАЯ"));
        if(!г) return "УЗЛА НЕТ";
        if(г.режетПоШирине) return "УЕЗЖАЕТ за край";
        if(г.режетПоВысоте) return "ОБРЕЗАНО по высоте";
        return "рвётся, строк "+г.строк;
      }],
    ["⑩ карточка очень длинного имени", function(){
        закрыть();
        setTimeout(function(){ открытьЧек("СЕВЕРНЫЙ ПУТЬ"); }, 200);
      }, function(){
        return заголовок("СЕВЕРНЫЙ ПУТЬ") ? "карточка открыта" : "НЕТ";
      }],
    // ⚠️ ЗДЕСЬ ПРОВЕРЯЕТСЯ САМО ОГРАНИЧЕНИЕ: имени двух строк мало, и
    // заголовок обязан ОСТАНОВИТЬСЯ на двух, а не разъехаться на четыре.
    ["⑪ очень длинное имя ограничено двумя строками", null, function(){
        var г=геометрия(заголовок("СЕВЕРНЫЙ ПУТЬ"));
        if(!г) return "УЗЛА НЕТ";
        return г.строк===2 ? "строк 2, остальное многоточием"
             : "строк "+г.строк+" — ОГРАНИЧЕНИЕ НЕ РАБОТАЕТ";
      }],
  ];

  function шаг(i){
    if(i>=сценарий.length){
      document.getElementById("ЗАМЕР").textContent=JSON.stringify(шаги);
      return;
    }
    var с=сценарий[i];
    try{ if(с[1]) с[1](); }catch(е){ шаги.push(с[0]+": ОШИБКА "+е.message); return шаг(i+1); }
    setTimeout(function(){
      var что;
      try{ что=с[2](); }catch(е){ что="ОШИБКА "+е.message; }
      шаги.push(с[0]+": "+что);
      шаг(i+1);
    }, 700);
  }
  function старт(){
    if(!кнопкаРовно("Чеки") && ждём++<80) return setTimeout(старт,150);
    if(!кнопкаРовно("Чеки")){
      document.getElementById("ЗАМЕР").textContent=
        JSON.stringify({"НЕ_ОТРИСОВАЛОСЬ":true});
      return;
    }
    шаг(0);
  }
  старт();
})();
</script>
<script type="module" src="./probe.jsx"></script></body></html>
