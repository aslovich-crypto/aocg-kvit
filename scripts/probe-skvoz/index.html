<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>сквозная проба</title>
<style>body{margin:0;background:#F6F7F9;width:430px}</style></head>
<body><div id="root"></div>
<div id="ЗАМЕР"></div>
<script>
// ⚠️ СКВОЗНОЙ СЦЕНАРИЙ (T135): нажал → сервер → база → экран. Ни одного
// подставленного ответа: на том конце настоящий FastAPI и настоящий
// PostgreSQL. Что записалось в базу, драйвер сверяет ОТДЕЛЬНО, запросом
// к базе, — потому что «экран показал» и «в базе лежит» это разные
// утверждения, и расходятся они молча.
(function(){
  var шаги=[], ждём=0;
  function текстКнопок(){
    return [].slice.call(document.querySelectorAll('button'));
  }
  function кнопкаСо(подстрокой){
    return текстКнопок().find(function(б){
      return (б.textContent||"").indexOf(подстрокой)>=0;
    });
  }
  function кнопкаРовно(текст){
    return текстКнопок().find(function(б){
      return (б.textContent||"").trim()===текст;
    });
  }
  function вписать(поле, значение){
    // React не видит value, выставленное напрямую — у него свой сеттер
    var сеттер=Object.getOwnPropertyDescriptor(
      window.HTMLInputElement.prototype, "value").set;
    сеттер.call(поле, значение);
    поле.dispatchEvent(new Event('input',{bubbles:true}));
  }
  function экран(){
    var м=document.querySelector('button[aria-label="Переключить приложение"]');
    var s=м && м.parentElement ? м.parentElement.querySelector('span') : null;
    return s ? s.textContent.trim() : "—";
  }
  // ⚠️ ТОЛЬКО ВИДИМЫЙ ТЕКСТ, А НЕ `body.textContent` (T169/T171, заход B).
  // Сам сценарий лежит инлайновым <script> ВНУТРИ body, и его исходник
  // попадает в текст страницы: замер находил искомые строки В САМОМ СЕБЕ и
  // отвечал «вижу» на пустом экране. Так уже зеленел сторож автора.
  // Обходим текстовые узлы и берём только те, чей родитель отрисован.
  function видимыйТекст(){
    var ходок=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var куски=[];
    while(ходок.nextNode()){
      var р=ходок.currentNode.parentElement;
      if(!р || р.tagName==="SCRIPT" || р.tagName==="STYLE") continue;
      var рект=р.getBoundingClientRect();
      if(рект.width<=0 || рект.height<=0) continue;
      куски.push(ходок.currentNode.nodeValue);
    }
    return куски.join(" ");
  }
  function естьТекст(подстрока){
    return видимыйТекст().indexOf(подстрока)>=0;
  }

  var ЧЕК_ПРОДАВЕЦ="ООО Сквозной Продавец";
  var ЧЕК_СУММА="1234.56";
  var ОТЧЁТ="Сквозной отчёт";

  var сценарий=[
    // ⚠️ СОГЛАСИЕ — ПЕРВЫЙ ЭКРАН ЖИВОГО ЧЕЛОВЕКА, и найден он ИМЕННО
    // сквозным прибором: с подставленными ответами его не видно вовсе.
    // Ключи в localStorage приложение не признаёт — согласие спрашивается
    // у СЕРВЕРА, и это верно: галочка на чужом телефоне ничего не доказывает.
    ["⓪ галочки отмечены", function(){
        // ⚠️ ГАЛОЧКА — ОТДЕЛЬНАЯ КНОПКА aria-label="Отметить", а подпись
        // рядом ОТКРЫВАЕТ ДОКУМЕНТ. Первая редакция пробы кликала подпись
        // и вместо согласия открывала шторку с политикой — сценарий дальше
        // шёл по перекрытому экрану и красил всё подряд.
        [].slice.call(document.querySelectorAll('button[aria-label="Отметить"]'))
          .forEach(function(б){ б.click(); });
      }, function(){
        var от=[].slice.call(
          document.querySelectorAll('button[aria-label="Отметить"]'))
          .filter(function(б){ return б.getAttribute('aria-pressed')==="true"; });
        return от.length===2 ? "обе отмечены" : "отмечено "+от.length;
      }],
    // ⚠️ ОТДЕЛЬНЫМ ШАГОМ, А НЕ СЛЕДОМ ЗА ГАЛОЧКАМИ: «Продолжить» до
    // перерисовки ещё заблокирована, и клик по ней проходит вникуда.
    ["⓪б согласие отправлено", function(){
        var д=кнопкаРовно("Продолжить"); if(д) д.click();
      }, function(){ return кнопкаРовно("Чеки") ? "пройдено" : "НЕ ПРОЙДЕНО"; }],
    // ⚠️ Приложение стартует на «Главной», а кнопка ввода чека живёт
    // на «Чеках» — этот шаг переход, а не украшение.
    ["① экран чеков", function(){
        var к=кнопкаРовно("Чеки"); if(к) к.click();
      }, function(){ return экран(); }],
    ["② открыт ввод чека", function(){
        var к=document.querySelector('button[aria-label="Добавить чек"]');
        if(к) к.click();
      }, function(){ return document.querySelector('[role="dialog"], .modal') || кнопкаСо("вручную") ? "сканер открыт" : "НЕТ"; }],
    ["③ ручной ввод", function(){
        var к=кнопкаСо("вручную"); if(к) к.click();
      }, function(){ return кнопкаСо("Записать без проверки") ? "реквизиты" : "НЕТ"; }],
    ["④ форма чека", function(){
        var к=кнопкаСо("Записать без проверки"); if(к) к.click();
      }, function(){ return кнопкаРовно("Добавить чек") ? "форма" : "НЕТ"; }],
    ["⑤ чек отправлен", function(){
        // Поля формы: продавец и сумма — по подписям над ними.
        var поля=[].slice.call(document.querySelectorAll('input'));
        var продавец=поля.find(function(п){
          var т=(п.placeholder||"")+" "+(п.getAttribute('aria-label')||"");
          return /продав|организац|магаз|ООО/i.test(т);
        }) || поля[0];
        var сумма=поля.find(function(п){
          var т=(п.placeholder||"")+" "+(п.getAttribute('aria-label')||"");
          return /сумм|итог|₽/i.test(т);
        });
        if(продавец) вписать(продавец, ЧЕК_ПРОДАВЕЦ);
        if(сумма) вписать(сумма, ЧЕК_СУММА);
        var к=кнопкаРовно("Добавить чек"); if(к) к.click();
      }, function(){ return естьТекст(ЧЕК_ПРОДАВЕЦ) ? "чек на экране" : "НЕ ВИДЕН"; }],

    // ⚠️ СУММА ПРОВЕРЯЕТСЯ И НА ЭКРАНЕ, А НЕ ТОЛЬКО В БАЗЕ (T171, заход B).
    // Обратная проверка 06.09.2026: обнуление суммы при приёме списка
    // (`amount: 0` вместо `Number(r.amount)`) оставляло сторож ЗЕЛЁНЫМ —
    // сумма сверялась SQL-запросом, а обратный путь «база → экран» не
    // проверялся вовсе. Сквозной прибор обязан замкнуть круг: цифра, которую
    // видит человек, а не та, что лежит в таблице.
    ["⑤б сумма видна на экране", null, function(){
        var т=видимыйТекст().replace(/\u00a0/g, " ");
        return /1\s?234[.,]56/.test(т) ? "сумма на экране" : "СУММЫ НЕТ";
      }],
    ["⑥ экран отчётов", function(){
        var к=кнопкаРовно("Отчёты"); if(к) к.click();
      }, function(){ return экран(); }],
    ["⑦ форма отчёта", function(){
        var к=document.querySelector('button[aria-label="Новый отчёт"]');
        if(к) к.click();
      }, function(){ return кнопкаРовно("Создать отчёт") ? "форма" : "НЕТ"; }],
    // ⚠️ ТРИ ДЕЙСТВИЯ, А НЕ ОДНО: кнопка «Создать отчёт» заблокирована,
    // пока нет НАЗВАНИЯ и хотя бы ОДНОГО выбранного чека. Первая редакция
    // вписывала название в первое попавшееся поле (им оказался поиск)
    // и жала заблокированную кнопку — экран при этом выглядел «как надо»,
    // и только сверка с базой показала, что отчёта нет.
    ["⑧ отчёт заполнен", function(){
        var поля=[].slice.call(document.querySelectorAll('input'));
        var имя=поля.find(function(п){
          return /Командировка|Название/i.test(
            (п.placeholder||"")+" "+(п.getAttribute('aria-label')||""));
        });
        if(имя) вписать(имя, ОТЧЁТ);
        // Чек выбирается кликом по строке списка «свободных» чеков.
        var строка=[].slice.call(document.querySelectorAll('div'))
          .filter(function(д){
            return (д.textContent||"").indexOf(ЧЕК_ПРОДАВЕЦ)>=0 &&
              д.getAttribute('style') &&
              д.getAttribute('style').indexOf('cursor: pointer')>=0;
          }).pop();
        if(строка) строка.click();
      }, function(){
        var к=кнопкаРовно("Создать отчёт");
        return к && !к.disabled ? "кнопка активна" : "кнопка заблокирована";
      }],
    ["⑨ отчёт создан", function(){
        var к=кнопкаРовно("Создать отчёт"); if(к) к.click();
      }, function(){
        // ⚠️ ЧЕСТНЫЙ ЗАМЕР: форма ЗАКРЫЛАСЬ и отчёт виден в списке.
        // Пока форма открыта, название лежит в поле — и проверка «текст
        // есть на экране» отвечала «да» на неотправленной форме.
        var форма=кнопкаРовно("Создать отчёт");
        return !форма && естьТекст(ОТЧЁТ) ? "отчёт в списке" : (форма ? "форма не закрылась" : "НЕ ВИДЕН");
      }],
  ];

  function идти(i){
    if(i>=сценарий.length){
      document.getElementById("ЗАМЕР").textContent=JSON.stringify(шаги);
      return;
    }
    if(сценарий[i][1]) сценарий[i][1]();
    setTimeout(function(){
      var что="—";
      try { что=сценарий[i][2](); } catch(е){ что="ОШИБКА ЗАМЕРА"; }
      // ⚠️ К КАЖДОМУ ШАГУ — СЛЕПОК ЭКРАНА. Без него красный говорит «НЕТ»
      // и не говорит, что человек видит: чинить приходится наугад (T89).
      // Драйвер сверяет только часть до « ~ », слепок идёт после.
      var слепок=текстКнопок().map(function(б){
        return (б.textContent||"").trim().slice(0,18);
      }).filter(Boolean).slice(0,8).join(" | ");
      шаги.push(сценарий[i][0]+": "+что+" ~ "+слепок);
      идти(i+1);
    }, 700);
  }
  function старт(){
    // ⚠️ ЖДЁМ ПРИЛОЖЕНИЕ, а не идём по мёртвому DOM. Проба сперва
    // регистрируется настоящим запросом (probe.jsx) — это дольше, чем
    // отрисовка с подставленным токеном, поэтому ожидание длиннее.
    var маркерОшибки=document.getElementById("ЗАМЕР").textContent;
    if(маркерОшибки) return;  // probe.jsx уже сказал, что вход не удался
    // Ждём ЛИБО согласие (первый экран), ЛИБО уже готовое приложение.
    var готово=кнопкаРовно("Чеки") || кнопкаРовно("Продолжить");
    if(!готово && ждём++<80) return setTimeout(старт,150);
    if(!готово){
      // ⚠️ Причина обязана быть ВИДНА: «не поднялось» без того, ЧТО на
      // экране, отправляет чинить наугад. Печатаем подписи кнопок —
      // по ним сразу видно, экран входа это, согласие или пустота.
      document.getElementById("ЗАМЕР").textContent=
        JSON.stringify({"НЕ_ОТРИСОВАЛОСЬ":true,
          "причина":"приложение не поднялось за 12 с; кнопки: "+
            текстКнопок().map(function(б){
              return (б.textContent||"").trim().slice(0,24);
            }).slice(0,12).join(" | ")+
            "; текст: "+видимыйТекст().trim().slice(0,160)});
      return;
    }
    идти(0);
  }
  старт();
})();
</script>
<script type="module" src="./probe.jsx"></script></body></html>
