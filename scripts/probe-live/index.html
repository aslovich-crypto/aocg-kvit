<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>живая проба</title>
<style>body{margin:0;background:#F6F7F9;width:430px}</style></head>
<body><div id="root"></div><div id="ЗАМЕР"></div>
<script>
window.__ОШИБКИ=[];
window.__СЕТЬ=[];
(function(){var о=window.fetch;window.fetch=function(u,i){
  var м=(i&&i.method)||'GET'; var а=String(u&&u.url?u.url:u);
  window.__СЕТЬ.push('вызов '+м+' '+а);
  try{ return о.apply(this,arguments).then(function(r){window.__СЕТЬ.push('ответ '+r.status+' '+а);return r;},
    function(e){window.__СЕТЬ.push('ОТКАЗ '+а+' :: '+(e&&(e.name+': '+e.message)));throw e;});
  }catch(e){window.__СЕТЬ.push('БРОСОК СИНХРОННО '+а+' :: '+(e&&e.message));throw e;}
};})();
window.addEventListener('error',function(e){
  window.__ОШИБКИ.push((e.error&&(e.error.stack||e.error.message))||e.message);
});
window.addEventListener('unhandledrejection',function(e){
  window.__ОШИБКИ.push("promise: "+((e.reason&&(e.reason.stack||e.reason.message))||e.reason));
});
(function(){
  var шаги=[], ждём=0;
  // ⚠️ ТОЛЬКО ВИДИМЫЙ ТЕКСТ, А НЕ `body.textContent` (T169/T171, заход B).
  // Сам сценарий лежит инлайновым <script> ВНУТРИ body, и его исходник
  // попадает в текст страницы: замер находил искомые строки В САМОМ СЕБЕ и
  // отвечал «вижу» на пустом экране. Так уже зеленел сторож автора.
  // Обходим текстовые узлы и берём только те, чей родитель отрисован.
  function видимыйТекст(){
    var ходок=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var куски=[];
    while(ходок.nextNode()){
      var р=ходок.currentNode.parentElement;
      if(!р || р.tagName==="SCRIPT" || р.tagName==="STYLE") continue;
      var рект=р.getBoundingClientRect();
      if(рект.width<=0 || рект.height<=0) continue;
      куски.push(ходок.currentNode.nodeValue);
    }
    return куски.join(" ");
  }
  function кнопкаПо(t){return [].slice.call(document.querySelectorAll('button')).find(function(b){return (b.textContent||"").trim()===t;});}
  function вписать(поле,знач){
    var s=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,"value").set;
    s.call(поле,знач); поле.dispatchEvent(new Event('input',{bubbles:true}));
  }
  function живо(){return document.querySelectorAll('#root *').length;}
  var сценарий=[
    ["① загрузка", function(){
      /* контроль: сеть из страницы вообще ходит? */
      fetch(location.origin+"/api/users/me").then(function(r){return r.json();})
        .then(function(d){window.__КОНТРОЛЬ="прямой fetch: role="+(d&&d.role);})
        .catch(function(e){window.__КОНТРОЛЬ="прямой fetch УПАЛ: "+e.message;});
    }],
    ["④а тап по строке сотрудника", function(){
        /* ⚠️ ТАП, А НЕ click(): строка ловит указатель, и click() мимо неё.
           Двигать нельзя — иначе это свайп, и откроется полоса. */
        var р=[].slice.call(document.querySelectorAll("div")).find(function(d){
          return (d.textContent||"").indexOf("Живой")>=0 && d.getAttribute("style") && d.getAttribute("style").indexOf("translateX")>=0;
        });
        window.__ТАП = р ? ("нашлась: "+(р.getAttribute("style")||"").slice(0,60)) : "СТРОКА НЕ НАЙДЕНА";
        if(!р) return;
        var о={bubbles:true,cancelable:true,pointerId:1,pointerType:"touch",isPrimary:true,clientX:100,clientY:100};
        try{ р.dispatchEvent(new PointerEvent("pointerdown",о)); }catch(e){ window.__ТАП += " | down упал: "+e.message; }
        try{ р.dispatchEvent(new PointerEvent("pointerup",о)); }catch(e){ window.__ТАП += " | up упал: "+e.message; }
    }],
    ["④б выбрал Бухгалтера", function(){var k=кнопкаПо("Бухгалтер"); if(k)k.click();}],
    ["④в нажал Изменить роль", function(){var k=кнопкаПо("Изменить роль"); if(k)k.click();}],
    ["④ открыл форму", function(){var k=кнопкаПо("+ Пригласить сотрудника"); if(k)k.click();}],
    ["⑤ заполнил", function(){
        /* ⚠️ ТОЛЬКО ПОЛЯ ФОРМЫ. Первая редакция брала inputs[0] по всему
           документу и вписывала почту в ПОИСК ПО ХАБУ — тот отфильтровал
           все пункты, и проба «доказала» пустой экран, которого нет. */
        var лист=(кнопкаПо("Отправить приглашение")||{}).closest
          ? кнопкаПо("Отправить приглашение").closest('div[role="dialog"]')
            || кнопкаПо("Отправить приглашение").parentElement.parentElement
          : null;
        var п=(лист||document).querySelectorAll('input');
        if(п[0])вписать(п[0],"al@aocg.ru");
        if(п[1])вписать(п[1],"Анис");
        if(п[2])вписать(п[2],"Ламри");
    }],
    ["⑤а выбрал РУКОВОДИТЕЛЬ", function(){var k=кнопкаПо("Руководитель"); if(k)k.click();}],
    ["⑥ НАЖАЛ ОТПРАВИТЬ", function(){var k=кнопкаПо("Отправить приглашение"); if(k)k.click();}],
    ["⑦ через секунду", null],
  ];
  function идти(i){
    if(i>=сценарий.length){
      var отчёт=JSON.stringify({шаги:шаги,ошибки:window.__ОШИБКИ,контроль:window.__КОНТРОЛЬ,тап:window.__ТАП,сеть:window.__СЕТЬ,токен:localStorage.getItem("access_token")});
      document.getElementById("ЗАМЕР").textContent=отчёт;
      /* ⚠️ ОТЧЁТ УХОДИТ НА СТЕНД, а не ждёт выгрузки DOM: при
         виртуальном времени Chrome выгружает страницу раньше, чем
         успевают уйти настоящие запросы, и замер выходит пустым. */
      fetch("/отчёт",{method:"POST",body:отчёт});
      return;
    }
    try{ if(сценарий[i][1]) сценарий[i][1](); }catch(e){ window.__ОШИБКИ.push("действие "+сценарий[i][0]+": "+(e.stack||e.message)); }
    setTimeout(function(){
      var ал=[].slice.call(document.querySelectorAll('[role="alert"]')).map(function(x){return x.textContent.trim();});
      шаги.push("   плашки: "+JSON.stringify(ал)+" | текст листа: "+видимыйТекст().replace(/\s+/g," ").slice(0,220));
      var пол=[].slice.call(document.querySelectorAll("input")).map(function(x){return (x.getAttribute("aria-label")||x.type)+"="+JSON.stringify(x.value);});
      var от=кнопкаПо("Отправить приглашение");
      шаги.push("   поля: "+пол.join(" ")+" | кнопка disabled="+(от?от.disabled:"нет кнопки"));
      var э=[].slice.call(document.querySelectorAll("[data-ekran]")).map(function(x){return x.getAttribute("data-ekran");});
      var кн=[].slice.call(document.querySelectorAll("button")).map(function(x){return (x.textContent||"").trim().slice(0,24);}).filter(Boolean);
      шаги.push(сценарий[i][0]+": узлов "+живо()+" | экраны["+э.join(",")+"] | кнопки["+кн.slice(0,12).join(" / ")+"]");
      идти(i+1);
    }, 900);
  }
  function старт(){
    if(!кнопкаПо("+ Пригласить сотрудника") && ждём++<40) return setTimeout(старт,150);
    идти(0);
  }
  старт();
})();
</script>
<script type="module" src="./probe.jsx"></script></body></html>
